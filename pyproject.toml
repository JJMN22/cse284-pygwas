[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "pygwas"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "cyvcf2>=0.30",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "qqman>=0.1",
]

[project.scripts]
pygwas = "pygwas.cli:main"

[tool.setuptools.packages.find]
include = ["pygwas*"]
